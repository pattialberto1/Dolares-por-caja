services:
  dolares:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./datos:/datos
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODELO_CLAUDE: ${MODELO_CLAUDE:-claude-opus-5}
      PIN_ADMIN: ${PIN_ADMIN:-1234}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-0}
